name: cms_site_manager
description: CMS Site Manager AI — Solar Site Construction Management System.
publish_to: 'none'
version: 12.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP client for real API calls
  http: ^1.2.1

  # GPS location for check-in pings
  geolocator: ^10.1.0

  # Session persistence (tokens + check-in state)
  shared_preferences: ^2.2.3

  # Camera / gallery capture of site evidence
  image_picker: ^1.0.7

  # Live map (OpenStreetMap tiles, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local storage of photos & videos on the device
  path_provider: ^2.1.3

  # Preview of recorded site videos
  video_player: ^2.8.6

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # Text: Plus Jakarta Sans. Numbers, clock and percentages: JetBrains Mono (both SIL OFL, see assets/fonts).
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
